# Rendu par lots des vidéos courtes du calendrier (scripts/shorts-video.ts), avec voix off, musique et
# sous-titres : les MP4, leurs .srt et leurs légendes partent en artefact « shorts ». Sert à programmer
# YouTube Shorts (et TikTok) à l'avance ; Facebook et Instagram sont publiés par shorts-publish.
# Le lundi : les 4 créneaux de la semaine. À la main : n'importe quelle période.
name: shorts-weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      from:
        description: "Premier jour AAAA-MM-JJ (vide = aujourd'hui)"
        type: string
        default: ""
      count:
        description: "Nombre de créneaux à rendre"
        type: string
        default: "4"

concurrency:
  group: shorts-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ffmpeg pour l'encodage, DejaVu pour les accents et le symbole euro dans le texte posé par sharp.
      - name: ffmpeg + polices
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - run: npm ci

      - name: Rendu des vidéos
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Voix françaises natives, prioritaires dès que le secret existe (scripts/shorts-audio.ts).
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          FROM: ${{ inputs.from }}
          COUNT: ${{ inputs.count }}
        run: |
          [ -z "$FROM" ] && FROM=$(date -u +%F)
          [ -z "$COUNT" ] && COUNT=4
          npx --yes tsx --tsconfig tsconfig.json scripts/shorts-video.ts --out shorts-out --from "$FROM" --count "$COUNT"

      - uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: shorts-out/
          retention-days: 30
